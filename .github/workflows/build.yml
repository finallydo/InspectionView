name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      # 솔루션 전체 (C# SDK 프로젝트 + C++ Native DLL + WPF) 를 x64 로 빌드
      - name: Build solution (Release x64)
        run: msbuild InspectionView.sln -restore -m -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Test Core
        run: dotnet test tests/InspectionView.Core.Tests/InspectionView.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Test Script
        run: dotnet test tests/InspectionView.Script.Tests/InspectionView.Script.Tests.csproj -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=script.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
